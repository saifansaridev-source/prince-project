<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Ghar Bazaar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">🏠</div>
        <div>Ghar<span>Bazaar</span></div>
      </a>
      <div>
        <a href="/" class="btn btn-outline btn-sm">← Back to Home</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card" style="max-width: 480px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 24px; font-weight: 800; color: var(--dark);">Create Your Account</h2>
        <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">Join Ghar Bazaar as a Renter or Property Broker.</p>
      </div>

      <!-- Role Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabRenter" onclick="switchSignupRole('user')">
          👤 Renter
        </button>
        <button class="auth-tab" id="tabBroker" onclick="switchSignupRole('broker')">
          🏢 Broker / Owner
        </button>
      </div>

      <!-- Google Sign-In Section -->
      <div id="googleButtonContainer" style="margin-bottom: 14px; min-height: 44px; display: flex; justify-content: center;"></div>
      
      <button type="button" class="btn-google" id="demoGoogleBtn" onclick="handleDemoGoogleSignup()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Sign Up with Google</span>
      </button>

      <div class="auth-divider">
        <span>or sign up with email</span>
      </div>

      <!-- Signup Form -->
      <form id="signupForm">
        <input type="hidden" id="signupRole" value="user">

        <div class="form-group">
          <label for="signupName">Full Name *</label>
          <input type="text" id="signupName" class="form-control" placeholder="Rahul Sharma" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address *</label>
          <input type="email" id="signupEmail" class="form-control" placeholder="rahul@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="signupPhone">Phone Number *</label>
          <input type="tel" id="signupPhone" class="form-control" placeholder="+91 98765 43210" required autocomplete="tel">
        </div>

        <!-- Broker Agency Field (Shown only for brokers) -->
        <div class="form-group" id="agencyGroup" style="display: none;">
          <label for="signupAgency">Agency / Business Name (Optional)</label>
          <input type="text" id="signupAgency" class="form-control" placeholder="e.g. Apex Realty Mumbai">
        </div>

        <div class="form-group">
          <label for="signupPassword">Password (Min. 6 Characters) *</label>
          <input type="password" id="signupPassword" class="form-control" placeholder="Create a strong password" minlength="6" required autocomplete="new-password">
        </div>

        <div id="signupMessage" style="font-size: 13px; color: var(--danger); margin-bottom: 12px; min-height: 18px;"></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="signupSubmitBtn">
          <span>Create Account</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--muted);">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 700;">Log In</a>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
  <script>
    let activeRole = "user";

    function switchSignupRole(role) {
      activeRole = role;
      document.getElementById("signupRole").value = role;

      if (role === "user") {
        document.getElementById("tabRenter").classList.add("active");
        document.getElementById("tabBroker").classList.remove("active");
        document.getElementById("agencyGroup").style.display = "none";
      } else {
        document.getElementById("tabRenter").classList.remove("active");
        document.getElementById("tabBroker").classList.add("active");
        document.getElementById("agencyGroup").style.display = "block";
      }
    }

    async function initGoogleAuth() {
      try {
        const config = await api("/api/auth/google-client-id");
        if (config.configured && window.google) {
          google.accounts.id.initialize({
            client_id: config.clientId,
            callback: handleGoogleSignupResponse
          });
          google.accounts.id.renderButton(
            document.getElementById("googleButtonContainer"),
            { theme: "outline", size: "large", width: "100%" }
          );
          document.getElementById("demoGoogleBtn").style.display = "none";
        }
      } catch (err) {
        console.log("Using demo viva sign up.");
      }
    }

    async function handleGoogleSignupResponse(response) {
      try {
        const res = await api("/api/auth/google", {
          method: "POST",
          body: JSON.stringify({
            credential: response.credential,
            requestedRole: activeRole
          })
        });

        showToast("Account created via Google!", "success");
        setTimeout(() => {
          window.location.href = res.user.role === "broker" ? "/broker-dashboard.html" : "/user-dashboard.html";
        }, 700);
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function handleDemoGoogleSignup() {
      const demoEmail = activeRole === "broker" ? `broker_${Date.now()}@gharbazaar.com` : `renter_${Date.now()}@gmail.com`;
      const demoName = activeRole === "broker" ? "Demo Broker" : "Demo Renter";

      try {
        const res = await api("/api/auth/google", {
          method: "POST",
          body: JSON.stringify({
            demoUser: true,
            email: demoEmail,
            name: demoName,
            requestedRole: activeRole
          })
        });

        showToast(`Account created for ${demoName}!`, "success");
        setTimeout(() => {
          window.location.href = res.user.role === "broker" ? "/broker-dashboard.html" : "/user-dashboard.html";
        }, 700);
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    // Submit handler
    document.getElementById("signupForm")?.addEventListener("submit", async function(e) {
      e.preventDefault();
      const msg = document.getElementById("signupMessage");
      msg.textContent = "";

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const phone = document.getElementById("signupPhone").value.trim();
      const password = document.getElementById("signupPassword").value;
      const agencyName = document.getElementById("signupAgency")?.value.trim() || "";

      const btn = document.getElementById("signupSubmitBtn");
      btn.disabled = true;
      btn.innerHTML = "<span>Creating Account & Sending OTP...</span>";

      try {
        const res = await api("/api/auth/signup", {
          method: "POST",
          body: JSON.stringify({
            name,
            email,
            phone,
            password,
            role: activeRole,
            agencyName
          })
        });

        showToast(res.message || "Account created! Please verify your email.", "success");
        setTimeout(() => {
          window.location.href = `/verify-email.html?email=${encodeURIComponent(res.email)}`;
        }, 1000);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = "<span>Create Account</span>";
        msg.textContent = err.message || "Failed to create account.";
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("role") === "broker") {
        switchSignupRole("broker");
      }
      setTimeout(initGoogleAuth, 500);
    });
  </script>
</body>
</html>
