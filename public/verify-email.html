<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | Ghar Bazaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">🏠</div>
        <div>Ghar<span>Bazaar</span></div>
      </a>
      <div>
        <a href="/" class="btn btn-outline btn-sm">← Back to Home</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="font-size: 42px; margin-bottom: 8px;">📬</div>
        <h2 style="font-size: 24px; font-weight: 800; color: var(--dark);">Verify Your Email</h2>
        <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">
          We sent a 6-digit verification code to:<br>
          <strong id="emailDisplay" style="color: var(--dark);">...</strong>
        </p>
      </div>

      <form id="verifyForm">
        <div class="form-group">
          <label for="verifyOtp">Enter 6-Digit Verification Code</label>
          <input type="text" id="verifyOtp" class="form-control" placeholder="123456" maxlength="6" style="text-align: center; font-size: 24px; font-weight: 800; letter-spacing: 6px;" required autocomplete="one-time-code">
        </div>

        <div id="verifyMessage" style="font-size: 13px; color: var(--danger); margin-bottom: 14px; min-height: 18px; text-align: center;"></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="verifySubmitBtn">
          <span>Verify & Continue →</span>
        </button>
      </form>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 13px;">
        <span style="color: var(--muted);">Didn't receive code?</span>
        <button type="button" class="btn btn-outline btn-sm" id="resendBtn">
          Resend OTP
        </button>
      </div>

      <!-- Demo viva mode hint -->
      <div id="demoOtpBox" style="background: #f0fdf4; border: 1px dashed #86efac; border-radius: var(--radius-md); padding: 14px; margin-top: 20px; font-size: 13px; color: #166534; line-height: 1.5; text-align: center;">
        <div><strong>💡 College Demo Mode Active</strong></div>
        <div style="margin: 6px 0;">Your OTP code is: <code id="demoOtpCode" style="font-size: 18px; font-weight: 800; letter-spacing: 2px;">Checking...</code></div>
        <button type="button" class="btn btn-outline btn-sm" id="autoFillOtpBtn" style="margin-top: 6px; border-color: #166534; color: #166534; font-weight: 700;">
          ⚡ Auto-fill OTP Code
        </button>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = (urlParams.get("email") || "").trim().toLowerCase();
    document.getElementById("emailDisplay").textContent = email || "your registered email";

    async function checkDemoOtp() {
      try {
        const res = await api(`/api/auth/demo-otp?email=${encodeURIComponent(email)}`);
        if (res.demoMode && res.otp) {
          document.getElementById("demoOtpCode").textContent = res.otp;
          document.getElementById("autoFillOtpBtn").onclick = () => {
            document.getElementById("verifyOtp").value = res.otp;
            showToast("OTP filled: " + res.otp, "success");
          };
        } else {
          document.getElementById("demoOtpBox").style.display = "none";
        }
      } catch (e) {
        document.getElementById("demoOtpBox").style.display = "none";
      }
    }

    if (email) {
      checkDemoOtp();
    }

    document.getElementById("verifyForm")?.addEventListener("submit", async function(e) {
      e.preventDefault();
      const msg = document.getElementById("verifyMessage");
      msg.textContent = "";

      const otp = document.getElementById("verifyOtp").value.trim();
      const btn = document.getElementById("verifySubmitBtn");

      btn.disabled = true;
      btn.innerHTML = "<span>Verifying...</span>";

      try {
        const res = await api("/api/auth/verify-email", {
          method: "POST",
          body: JSON.stringify({ email, otp })
        });

        showToast("Email verified successfully! Welcome to Ghar Bazaar.", "success");
        setTimeout(() => {
          if (res.user.role === "broker") {
            window.location.href = "/broker-dashboard.html";
          } else {
            window.location.href = "/user-dashboard.html";
          }
        }, 800);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = "<span>Verify & Continue →</span>";
        msg.textContent = err.message || "Invalid or expired OTP.";
      }
    });

    document.getElementById("resendBtn")?.addEventListener("click", async function() {
      const btn = this;
      btn.disabled = true;
      btn.textContent = "Sending...";

      try {
        const res = await api("/api/auth/resend-verification", {
          method: "POST",
          body: JSON.stringify({ email })
        });
        showToast(res.message || "New OTP sent!", "success");
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = "Resend OTP";
        }, 5000);
      }
    });
  </script>
</body>
</html>
